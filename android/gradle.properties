org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false

# Kotlin incremental compilation is off because this project lives on G: while
# the pub cache lives on C:. Kotlin's incremental state stores paths relative to
# a base directory, and Windows cannot express a relative path across drive
# roots, so compiling any plugin whose sources sit in the pub cache fails with
# "Could not close incremental caches ... class-fq-name-to-source.tab".
#
# Kotlin 2.2 merely logged this as a suppressed exception and carried on; 2.3
# treats it as fatal, which is what surfaced it. Plugin Kotlin sources change
# only when a dependency is upgraded, so the rebuild cost here is negligible.
kotlin.incremental=false
