name: pinpoint
description: "A new Flutter project."

publish_to: 'none'

version: 3.1.0+30

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Unlocks the display's peak refresh rate (90/120/144Hz) instead of the
  # 60Hz Flutter defaults to, and reports what the panel is actually doing.
  # Replaced flutter_displaymode: cross-platform, and it also surfaces the
  # thermal / low-power throttling that makes a device ignore the request.
  refresh_rate: ^1.0.2
  flutter_dotenv: ^6.0.0
  google_fonts: ^8.0.2
  shared_preferences: ^2.3.5
  go_router: ^18.0.0
  animate_do: ^5.1.0
  material_symbols_icons: ^4.2801.1
  stylish_bottom_bar: ^1.1.0
  flutter_staggered_grid_view: ^0.7.0
  drift: ^2.24.0
  drift_flutter: ^0.3.0
  get_it: ^9.0.5
  skeletonizer: ^2.0.1
  choice: ^2.3.2
  record: ^7.0.0
  audioplayers: ^6.1.2
  path_provider: ^2.1.5
  avatar_glow: ^3.0.1
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.7
  # Kept in step with what flutter_localizations requires — Flutter 3.47
  # needs ^0.20.3, and the previous exact 0.20.2 pin blocked resolution.
  intl: ^0.20.3
  toastification: ^3.0.0
  drift_db_viewer: ^2.1.0
  image_picker: ^1.1.2
  permission_handler: ^13.0.0
  delightful_toast: ^1.1.0
  flutter_animate: ^4.5.2
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.0
  local_auth: ^3.0.0
  encrypt: ^5.0.1
  speech_to_text: ^7.1.0
  logger: ^2.4.0
  share_plus: ^13.1.0
  printing: ^5.11.1
  file_picker: ^12.0.0-beta.5
  painter: ^2.0.0
  pdf: ^3.10.8
  flutter_secure_storage: ^11.0.0
  flutter_timezone: ^5.0.1
  in_app_purchase: ^3.3.0
  in_app_purchase_android: ^0.5.2
  # iOS StoreKit backend for in_app_purchase (App Store billing on iOS)
  in_app_purchase_storekit: ^0.4.10
  # Sign in with Apple (required by App Store Guideline 4.8 alongside Google Sign-In)
  sign_in_with_apple: ^8.1.0
  # SHA-256 nonce hashing for Sign in with Apple (was transitive; now used directly)
  crypto: ^3.0.6
  in_app_update: ^5.0.0
  in_app_review: ^2.0.12
  dio: ^5.7.0
  package_info_plus: ^10.1.0
  device_info_plus: ^13.1.0
  connectivity_plus: ^7.0.0
  provider: ^6.1.2
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.1
  google_sign_in: ^7.1.1
  firebase_analytics: ^12.1.2
  firebase_messaging: ^16.0.4
  firebase_crashlytics: ^5.0.8
  async_queue: ^3.0.0
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  fleather: ^1.28.0
  # Direct rather than transitive on purpose. fleather 1.28 and go_router 18
  # migrated to Flutter's decoupled Material package, and its widgets resolve
  # material_ui's own MaterialLocalizations type — not the one
  # flutter_localizations provides. main.dart registers its delegates, and
  # importing a package you only get transitively is how that silently breaks.
  material_ui: ^1.1.0
  parchment: ^1.15.0
  parchment_delta: ^1.0.0
  tutorial_coach_mark: ^1.3.3
  # At-rest DB encryption (Phase 1 / F2): sqlite3 3.x selects the encrypted
  # "SQLite Multiple Ciphers" build via the `hooks:` block below. sqlite3 + path
  # are used directly by lib/database/secure_database.dart.
  sqlite3: ^3.3.2
  path: ^1.9.1
  pointycastle: ^3.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.24.0
  build_runner: ^2.4.14

# Phase 1 / F2: build the encrypted "SQLite Multiple Ciphers" native library
# (supports PRAGMA key/rekey) instead of plain sqlite3, for at-rest DB encryption.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

flutter_plugins:
  logger:
    platforms:
      android:
      ios:
      linux:
      macos:
      web:
      windows:

flutter:
  uses-material-design: true

  # Generate AppL10n from the .arb files in lib/l10n (see l10n.yaml).
  generate: true

  assets:
    - .env
    - assets/images/
    - assets/legal/
    # Bundled Google Fonts (all weights + italics) so google_fonts loads them
    # from assets instead of fetching over the network at runtime. Discovered
    # automatically by google_fonts via the asset manifest; do NOT also list
    # them under `fonts:`. See lib/main.dart (allowRuntimeFetching = false).
    - assets/fonts/google_fonts/

  # Script fallback faces (Thai / Bengali / Arabic).
  #
  # These are declared under `fonts:` rather than dropped into
  # assets/fonts/google_fonts/ on purpose. The google_fonts assets above are
  # discovered dynamically by that package, which never gives them a family
  # name Flutter's font registry knows ahead of time — and a fontFamilyFallback
  # chain can only reference statically-registered names. Declaring them here
  # is what makes `fontFamilyFallback: ['Noto Sans Thai', ...]` in
  # design_system/typography.dart resolve.
  #
  # Every bundled google_fonts face is a Latin subset (Inter-Regular is 66 KB,
  # not the ~300 KB full face), so without these three families Thai, Bengali,
  # Arabic and Persian have no glyphs at all and fall through to whatever the
  # OS happens to provide.
  #
  # Instanced from the upstream variable fonts at four weights; Flutter snaps
  # the app's w400–w900 styles to the nearest. 1.5 MB total.
  fonts:
    - family: Noto Sans Thai
      fonts:
        - asset: assets/fonts/scripts/NotoSansThai-Regular.ttf
          weight: 400
        - asset: assets/fonts/scripts/NotoSansThai-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/scripts/NotoSansThai-Bold.ttf
          weight: 700
        - asset: assets/fonts/scripts/NotoSansThai-Black.ttf
          weight: 900
    - family: Noto Sans Bengali
      fonts:
        - asset: assets/fonts/scripts/NotoSansBengali-Regular.ttf
          weight: 400
        - asset: assets/fonts/scripts/NotoSansBengali-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/scripts/NotoSansBengali-Bold.ttf
          weight: 700
        - asset: assets/fonts/scripts/NotoSansBengali-Black.ttf
          weight: 900
    # Serves both Arabic (ar) and Persian (fa) — verified to cover the
    # Persian-only letters پ چ ژ گ ک ی and both digit sets.
    - family: Noto Sans Arabic
      fonts:
        - asset: assets/fonts/scripts/NotoSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/scripts/NotoSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/scripts/NotoSansArabic-Bold.ttf
          weight: 700
        - asset: assets/fonts/scripts/NotoSansArabic-Black.ttf
          weight: 900
