<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  Google Play feature graphic, 1024×500 — Sketchbook edition.
  Render: chrome --headless --screenshot=play-feature-graphic-1024x500.png
          --window-size=1024,500 --hide-scrollbars store/play-feature-graphic.html
  The phones show real device screenshots from docs/redesign/screenshots.
  Copy stays within what the app actually guarantees: encryption happens on
  the device, and zero-knowledge mode is optional (see CLAUDE.md).
-->
<style>
  @font-face { font-family: 'Jakarta'; font-weight: 500;
    src: url('../assets/fonts/google_fonts/PlusJakartaSans-Medium.ttf'); }
  @font-face { font-family: 'Jakarta'; font-weight: 800;
    src: url('../assets/fonts/google_fonts/PlusJakartaSans-ExtraBold.ttf'); }

  :root {
    --mauve: #8E7499; --block-a: #9A81A5; --block-b: #84698F;
    --cream: #F5F3EC; --ink: #141414; --yellow: #F6E27A;
    --lavender: #B9B6F2; --mint: #C9EDB4; --pink: #F7B8C8; --sky: #A9D3F5;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 500px; overflow: hidden; }
  body { font-family: 'Jakarta', system-ui, sans-serif; background: var(--mauve);
    -webkit-font-smoothing: antialiased; }

  .canvas { position: relative; width: 1024px; height: 500px; overflow: hidden; }
  .block { position: absolute; border-radius: 56px; }
  .block.a { background: var(--block-a); width: 520px; height: 420px; right: -60px; top: -90px; }
  .block.b { background: var(--block-b); width: 380px; height: 300px; right: 180px; bottom: -150px; }

  .copy { position: absolute; left: 64px; top: 0; bottom: 0; width: 430px;
    display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; }
  .sticker { width: 58px; height: 58px; border-radius: 17px; background: var(--yellow);
    border: 2.5px solid var(--ink); transform: rotate(-7deg);
    box-shadow: 3px 3px 0 var(--ink); display: grid; place-items: center; }
  .sticker img { width: 34px; height: 34px; }
  .brand span { font-weight: 800; font-size: 28px; color: var(--cream); letter-spacing: -0.02em; }
  h1 { font-weight: 800; font-size: 64px; line-height: 1.02; letter-spacing: -0.035em;
    color: var(--cream); }
  h1 mark { background: var(--yellow); color: var(--ink); border-radius: 10px;
    padding: 0 12px; }
  p { margin-top: 20px; font-weight: 500; font-size: 19px; line-height: 1.45;
    color: rgba(245, 243, 236, .86); max-width: 380px; }

  .phone { position: absolute; width: 214px; height: 463px; border-radius: 36px;
    background: #0B0B0B; padding: 7px; box-shadow: 0 30px 50px -18px rgba(35, 15, 45, .55); }
  .phone img { width: 100%; height: 100%; object-fit: cover; object-position: top;
    border-radius: 29px; display: block; }
  .p1 { left: 500px; top: 70px; transform: rotate(-8deg); z-index: 1; }
  .p2 { left: 650px; top: 24px; transform: rotate(3deg); z-index: 3; }
  .p3 { left: 800px; top: 82px; transform: rotate(10deg); z-index: 2; }

  .tile { position: absolute; border: 2.5px solid var(--ink); border-radius: 14px;
    box-shadow: 3px 3px 0 var(--ink); display: grid; place-items: center;
    font-weight: 800; color: var(--ink); z-index: 4; }
  .t1 { width: 54px; height: 54px; background: var(--mint); left: 616px; top: 420px;
    transform: rotate(12deg); font-size: 28px; }
  .t2 { width: 46px; height: 46px; background: var(--pink); left: 950px; top: 34px;
    transform: rotate(-10deg); font-size: 18px; }
</style>
</head>
<body>
<div class="canvas">
  <div class="block a"></div>
  <div class="block b"></div>

  <section class="copy">
    <div class="brand">
      <div class="sticker"><img src="../assets/images/brand/pin-ink.png" alt=""></div>
      <span>Pinpoint</span>
    </div>
    <h1>Notes that<br>stay <mark>yours.</mark></h1>
    <p>Notes, checklists, voice and reminders — encrypted on your device.</p>
  </section>

  <div class="phone p1"><img src="../docs/redesign/screenshots/phone_light_03-my-folders.png" alt=""></div>
  <div class="phone p2"><img src="../docs/redesign/screenshots/phone_light_01-home.png" alt=""></div>
  <div class="phone p3"><img src="../docs/redesign/screenshots/phone_light_05b-checklist-editor.png" alt=""></div>

  <div class="tile t1">&#10003;</div>
  <div class="tile t2">Aa</div>
</div>
</body>
</html>
